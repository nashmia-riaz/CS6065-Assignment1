<html>
    <head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="styles.css">
    </head>
    
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script  type="module" src="script.js"></script>
    <body>
        <span id="userIDDisplay"></span>
        <div class="input-group mb-3 input-container">        
            <input id="userID" type="text" class="form-control" aria-label="Default" aria-describedby="inputGroup-sizing-default" placeholder="User ID">
            <div class="input-group-append">
                <button id="enter">Enter</button>
            </div>
            <span class="error"></span>
        </div>
        <div id="start">
            <button disabled class="click inactive four" id="tlButton" style="display: none;">Click</button>
            <button disabled class="click inactive" id="tcButton" style="display: none;">Click</button>
            <button disabled class="click inactive four" id="trButton" style="display: none;">Click</button>
            <button disabled class="click inactive two" id="mlButton">Click</button>
            <button class="active start">Start</button>
            <button disabled class="click inactive two" id="mrButton">Click</button>
            <button disabled class="click inactive four" id="blButton" style="display: none;">Click</button>
            <button disabled class="click inactive" id="bcButton" style="display: none;">Click</button>
            <button disabled class="click inactive four" id="brButton" style="display: none;">Click</button>
        </div>
        <div id="trialsComplete">Trials complete! Thank you for participating!</div>
        <audio src="button-click.mp3"></audio>  
        <span class="credits">
